name: Bandung Job Discovery

on:
  schedule:
    # 05:00, 08:00, 11:00, 14:00, 17:00 WIB setiap hari.
    - cron: '0 22,1,4,7,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bandung-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --timeout 60 -r requirements.txt

      - name: Discover jobs and prepare AI drafts
        env:
          TIMEZONE: Asia/Jakarta
          LOCATION_QUERY: Bandung
          MAX_AGE_DAYS: '14'
          ALLOW_UNKNOWN_DATE: 'false'
          SEARCH_RESULTS_PER_QUERY: '25'
          MAX_DISCOVERED_PER_RUN: '300'
          MAX_AI_PER_RUN: '60'
          CV_PDF_BASE64: ${{ secrets.CV_PDF_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_TAB: 'Job Applications'
          PROFILE_TAB: 'Candidate Profile'
        run: python -u -m app.main

      - name: Commit local job database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.csv
          git diff --cached --quiet || git commit -m 'chore: update Bandung job database'
          git push