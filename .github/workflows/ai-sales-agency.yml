name: AI Sales Agency

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover new prospects
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m app.discover_once || true

      - name: Run AI Sales Agency
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WA_NUMBER: ${{ secrets.WA_NUMBER }}
          PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
          DAILY_OUTREACH_LIMIT: ${{ vars.DAILY_OUTREACH_LIMIT }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE }}
          MIN_MINUTES_BETWEEN_SENDS: ${{ vars.MIN_MINUTES_BETWEEN_SENDS }}
          TIMEZONE: Asia/Jakarta
        run: python -m app.main
