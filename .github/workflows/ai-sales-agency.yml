name: Bandung Job Hunter

on:
  schedule:
    - cron: '0 0,2,4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bandung-job-hunter
  cancel-in-progress: false

jobs:
  discover-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --timeout 60 -r requirements.txt

      - name: Run Job Hunter
        env:
          TIMEZONE: Asia/Jakarta
          LOCATION_QUERY: Bandung
          MAX_AGE_DAYS: '14'
          SEARCH_RESULTS_PER_QUERY: '20'
          MAX_DISCOVERED_PER_RUN: '150'
          MAX_AI_PER_RUN: '40'
          MIN_FIT_SCORE: '55'
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_WA: '6287813871926'
          GMAIL_ADDRESS: 'reybyoo@gmail.com'
          CV_PDF_BASE64: ${{ secrets.CV_PDF_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_TAB: 'Job Applications'
        run: python -u -m app.main

      - name: Commit queue database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.csv
          git diff --cached --quiet || git commit -m 'chore: update Bandung job queue'
          git push